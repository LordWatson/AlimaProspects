name: security

# Dependency advisories and secret scanning (Phase 20, ADR 0017).
#
# A separate workflow from `tests`, on purpose. These checks answer a question that has nothing to
# do with the diff - "is anything we depend on known-vulnerable today, and has a credential ever
# been committed" - so they need a **schedule** as well as a trigger. A dependency that was clean
# when a pull request merged is not clean forever, and nobody opens a pull request to tell us.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays, 06:00 UTC: before the week starts, after the weekend's advisories have landed.
    - cron: '0 6 * * 1'
  # So somebody can answer "are we affected" without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Reads `composer.lock` against the Packagist advisory database. `--locked` means no install
      # is needed, which is also why this job needs neither MySQL, Redis nor a built frontend.
      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      # `--audit-level=high` for the whole tree of both JavaScript projects, and the threshold is a
      # decision rather than a default. The moderates that remain are in build-time tooling with no
      # fixed release (`@capacitor/cli` pins an old `rimraf`), so failing on them would mean a red
      # build nobody can turn green - which is how a security gate ends up with `|| true` appended
      # to it. Dependabot raises those weekly instead, where they get reviewed rather than ignored.
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Audit mobile dependencies
        working-directory: mobile
        run: npm audit --audit-level=high

      # Production dependencies at a lower bar: these are the packages that run in front of a
      # customer, where a moderate advisory is worth the build going red.
      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit production mobile dependencies
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=moderate

  secrets:
    name: secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans history, so it needs all of it: a credential that was committed and then
          # removed in the next commit is still a credential that was published.
          fetch-depth: 0
          persist-credentials: false

      # The release binary rather than `gitleaks/gitleaks-action`, for two reasons. The action's v2
      # asks organisations for a licence key, which is a dependency on a vendor's billing state in
      # the job that is supposed to tell us about leaked keys. And a scanner is exactly the thing to
      # pin by **checksum** rather than by tag: this verifies the tarball against the signed
      # checksums file from the same release before running anything out of it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output gitleaks_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks_checksums.txt \
            | sed "s|gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz|gitleaks.tar.gz|" \
            | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the whole history for committed secrets
        run: ./gitleaks git --no-banner --redact --verbose --exit-code 1 .
